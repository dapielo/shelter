server {
    listen 80;                       # Nginx escucha en el puerto 80 del contenedor
    root /usr/share/nginx/html;      # carpeta donde estan los archivos de Angular
    index index.html;                # archivo que sirve al entrar en "/"

    client_max_body_size 10M;        # permite subir imagenes de hasta 10MB (por defecto solo 1MB)


    # Cualquier otra ruta: si existe como archivo (js, css, png) lo sirve;
    # si no (por ejemplo /pet/search), devuelve index.html y Angular se encarga de la ruta
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Todo lo que empiece por /shelter/ no es del front: se reenvia al backend, la ultima liena es para que mantenga el host original porqeu tengo el cors configurado para 127.0.0.1
    location /shelter/ {
    proxy_pass http://shelter-backend:8080;
    proxy_set_header Host $http_host;
}
}