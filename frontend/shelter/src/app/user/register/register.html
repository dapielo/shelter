<!-- El class.visible evalua lo que hay dentro como si fuese un if para ver si le pone la clase o no -->
<div class="error" [class.visible]="errorMessage()">
    {{errorMessage()}}
</div>
<div class="form-container">
    <form [formGroup]="formRegister" class="form" (ngSubmit)="onSubmit()">
        <h1>Formulario de registro</h1>

        <div class="form-field">
            <label for="email">Email: </label>
            <input type="text" formControlName="email" id="email" placeholder="Insertar email...">
        </div>
        <div class="form-field">
            <label for="username">Nombre de usuario: </label>
            <input type="text" formControlName="username" id="username" placeholder="Nombre de usuario...">
        </div>
        <div class="form-field">
            <label for="password">Contraseña: </label>
            <input type="password" formControlName="password" id="password" placeholder="entre 8 y 20 caracteres...">
        </div>
        <div class="form-field">
            <label for="passwordVerification">Repite la contraseña: </label>
            <input type="password" formControlName="passwordVerification" id="passwordVerification" placeholder="repite la contraseña...">
        </div>
        <div class="form-button">
            <button type="submit">Registrarse</button>
        </div>
    </form>
</div>
