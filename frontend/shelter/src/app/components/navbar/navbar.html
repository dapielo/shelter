<div class="navbar">
    <div class="navbar-bar">
        <a routerLink="/"><img src="images/shelter_icon.png" alt="Shelter"></a>
        <a routerLink="/">Inicio</a>
        <a routerLink="/pet/search">Buscador</a>
        <!-- los corchetes se usan cuando queremos acceder al ts para meter logica en la plantilla -->
        <a [routerLink]="authService.isLogged() ? '/adoption/pending' : '/login'">Adopciones Pendientes</a>
        <a [routerLink]="authService.isLogged() ? '/adoption/history' : '/login'">Historial</a>
        <a [routerLink]="authService.isLogged() ? '/fosterhome' : '/login'">Mis hogares</a>
    </div>
    <div class="user-bar">
        <app-session class="session"/>
        <img src="images/search.png" alt="Buscar">
        @if(authService.isLogged()) {
            <img src="images/logout.png" alt="Cerrar sesion" (click)="authService.logout()">
        } @else {
            <a routerLink="/login">
                <img src="images/login.png" alt="Iniciar sesion">
            </a>
        }
    </div>
</div>
