<div class="card" (click)="toPetInfo()">
    <div class="card-image">    
        @if (imgRoute()){
            <img src={{imgRoute()}} alt="Imagen de la mascota">
        } @else {
            <img src="/public/images/default_photo.png" alt="Imagen de la mascota">
        }
    </div>
    <div class="card-info">
        <span>Nombre: {{petFormatted().name}}</span>    
        <span>Especie: {{petFormatted().species}} </span>
        <span>Edad estimada: {{petFormatted().ageGroup}} </span>
    </div>
</div>
