<!-- Este body marca las sangrías laterales del cuerpo de la pantalla -->
<div class="body">

    <h1>BIENVENIDO A SHELTER</h1>
    <h2>Hay un compañero de viaje esperando por ti </h2>
    <!-- La carpeta public la sirve angular al navegador directamente en la raiz de la web -->
    <img class="banner" src="images/banner2_sepia.png" alt="Perro y gato conviviendo en armonía">

    <h3>Nuestros veteranos de shelter están esperando por alguien como tu.</h3>

    @if(pets()) {
        <app-pet-grid [pets]="pets()"></app-pet-grid>
    } @else {
        <div>No se ha podido cargar la lista de veteranos.</div>
    }

    <div class="filter">
        <div class="filter-catdog">
            <p class="catdog-title">¿ Leal seguidor canino ?</p>
            <img src="images/sketch-dog.png" alt="Imagen dibujaa de un perro.">
        </div>
        <div class="filter-catdog">
            <p class="catdog-title">¿ Fiel adorador gatuno ?</p>
            <img src="images/sketch-cat.png" alt="Imagen dibujada de un gato.">
        </div>
    </div>
</div>
