<div class="body">

    <div class="errorMessage" [class.visible]="errorMessage()"> {{errorMessage()}} </div>

    <h1 class="title">Solicitudes sobre mis mascotas</h1>

    @if (adoptionsAsOwner().length === 0) {
        <h2>Nada que mostrar</h2>
    } @else {
        <app-adoption-grid [adoptions]="adoptionsAsOwner()" buttonType="owner" class="pet-card"
        (acceptAdoption)="onAccept($event)"
        (declineAdoption)="onDecline($event)"/>
    }

    <h1 class="title">Mis solicitudes</h1>
    
    @if (adoptionsAsAdopter().length === 0) {
        <h2>Nada que mostrar</h2>
    } @else {  
        <app-adoption-grid [adoptions]="adoptionsAsAdopter()" buttonType="adopter" class="pet-card"
        (deleteAdoption)="onDelete($event)"/>
    }
</div>
