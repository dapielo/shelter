spring.application.name=shelter

# conexion con la base de datos (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3307/shelter
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# que spring cree tablas y las modifique
spring.jpa.hibernate.ddl-auto=update

# ver errores en la consola 
spring.web.error.include-message=ALWAYS

# para ver las consultas de SQL y que se vean legibles
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# carpeta para guardar imagenes
upload.dir=./uploads

